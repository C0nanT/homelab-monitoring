# Override do smoke test: troca os sites reais por sites falsos locais.
# Carregado pelo testes/smoke.sh junto com o docker-compose.yml da raiz.
# Todos os arquivos desta pasta entram em ordem alfabética. Um volume com o
# mesmo destino (target) substitui o do compose principal.
#
# SMOKE_TMP é a pasta temporária criada pelo smoke.sh (certificados falsos e
# cópias das configs). IMAGEM_NGINX vem do testes/smoke.env.
services:
  prometheus:
    volumes:
      # Mesma config da raiz, só com scrape_interval de 5s (gerada pelo smoke).
      - ${SMOKE_TMP:?definida pelo testes/smoke.sh}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${SMOKE_TMP}/alvos:/etc/prometheus/alvos:ro
    depends_on:
      site-ok:
        condition: service_healthy
      site-cert-ruim:
        condition: service_healthy

  blackbox:
    volumes:
      # Mesmo módulo da raiz, mais a CA do site falso (gerada pelo smoke).
      # A validação de TLS continua LIGADA: só confia nesta CA a mais.
      - ${SMOKE_TMP}/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ${SMOKE_TMP}/certs-ok/cert.pem:/smoke/ca.pem:ro

  # Site HTTPS no ar, com certificado confiado pelo blackbox do smoke.
  site-ok:
    image: ${IMAGEM_NGINX:?definida pelo testes/smoke.env}
    volumes:
      - ./testes/fixtures/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SMOKE_TMP}/certs-ok:/certs:ro
    networks:
      default:
        aliases: [site-ok]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Site HTTPS com certificado que NINGUÉM confia: prova que a validação de
  # TLS está ligada (probe_success deve ser 0).
  site-cert-ruim:
    image: ${IMAGEM_NGINX}
    volumes:
      - ./testes/fixtures/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SMOKE_TMP}/certs-ruim:/certs:ro
    networks:
      default:
        aliases: [site-cert-ruim]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/"]
      interval: 3s
      timeout: 3s
      retries: 10
