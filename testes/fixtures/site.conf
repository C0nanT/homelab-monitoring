# Site HTTPS falso do smoke test (nginx). O certificado vem montado em /certs.
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    location = /erro {
        return 500 "erro\n";
    }
    # Redireciona para HTTPS no mesmo host: o blackbox deve seguir.
    location = /redireciona {
        return 301 https://site-ok:8443/;
    }
    location / {
        return 200 "ok\n";
    }
}
