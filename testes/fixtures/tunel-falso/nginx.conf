# Túnel falso do smoke test (nginx): as mesmas portas do túnel de verdade.
#   tunel:8082/metrics -> séries do Traefik
#   tunel:9100/metrics -> séries do node exporter
# Os arquivos são gerados (e regerados a cada 5s) por gerar-metricas.sh.
# O Content-Type é obrigatório: o Prometheus 3 não aceita resposta sem ele.
server {
    listen 8082;
    location = /metrics {
        types { }
        default_type "text/plain; version=0.0.4; charset=utf-8";
        alias /tmp/metricas/traefik.prom;
    }
}
server {
    listen 9100;
    location = /metrics {
        types { }
        default_type "text/plain; version=0.0.4; charset=utf-8";
        alias /tmp/metricas/node.prom;
    }
}
