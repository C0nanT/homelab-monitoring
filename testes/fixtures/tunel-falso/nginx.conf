# Túnel falso do smoke test (nginx): as mesmas portas do túnel de verdade.
#   tunel:8082/metrics -> séries do Traefik
#   tunel:9100/metrics -> séries do node exporter
#   tunel:3100         -> Loki de verdade (serviço loki-falso), com linhas
#                         injetadas pelo smoke (testes/verificacoes/06-loki.sh)
# Os arquivos são gerados (e regerados a cada 5s) por gerar-metricas.sh.
# O Content-Type é obrigatório: o Prometheus 3 não aceita resposta sem ele.
server {
    listen 8082;
    location = /metrics {
        types { }
        default_type "text/plain; version=0.0.4; charset=utf-8";
        alias /tmp/metricas/traefik.prom;
    }
}
server {
    listen 9100;
    location = /metrics {
        types { }
        default_type "text/plain; version=0.0.4; charset=utf-8";
        alias /tmp/metricas/node.prom;
    }
}
server {
    listen 3100;
    # Como o túnel real, o nginx sobe mesmo com o Loki fora (o ssh também
    # abre o encaminhamento sem o Loki): por isso o endereço vai numa variável,
    # resolvido na hora de cada pedido pelo DNS do Docker. Loki fora = 502.
    resolver 127.0.0.11 valid=2s;
    set $loki http://loki-falso:3100;
    location / {
        proxy_pass $loki;
    }
}
