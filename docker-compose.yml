# Pilha de monitoramento da VPS, rodando no PC (não na VPS).
#
# Uso:
#   cp .env.example .env     # preencha TUNEL_HOST (veja "Túnel até a VPS")
#   docker compose up -d --build
#   docker compose ps
#
# Versões FIXAS (nada de latest): cada imagem aparece uma única vez, aqui
# (a do túnel, no tunel/Dockerfile).
# Veja "Fixar e atualizar as versões" no README antes de trocar uma tag.
#
# Verificação rápida sem subir nada: docker compose config -q
#
# Tetos de memória (mem_limit): todo serviço tem um, para um deles não comer a
# RAM do PC. Critério: uso estável abaixo de ~70% do teto (docker stats
# --no-stream, container com 1-2 min no ar). O teto é o valor medido / 0,7,
# arredondado para cima; se o uso passar de 70%, o teto sobe. Medido com o
# Grafana já enxuto e o provisionamento do repositório:
#   grafana ~255-261 MiB recém-subido; ~763 MiB depois de dias no ar, antes das
#   chaves de leveza (cresce com cache de painéis, alertas e consultas)
#   prometheus ~36-62 MiB | blackbox ~12-24 MiB | tunel ~3 MiB
# Estourar o teto = o kernel mata o processo (OOM) e o restart sobe de novo.
name: homelab-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    # 256m: ~62 MiB medido (24%); folga para o histórico (90d/2GB) crescer.
    mem_limit: 256m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Dois tetos no histórico, o que vier primeiro corta: 90 dias de tempo e
      # 2 GB de disco. O teto de disco impede o volume de crescer sem limite
      # num PC 24/7.
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Monta a PASTA (não o arquivo): o Prometheus relê os alvos sozinho
      # quando algo muda, sem reiniciar. Adicionar site = editar sites.yml.
      - ./prometheus/alvos:/etc/prometheus/alvos:ro
      - prometheus-dados:/prometheus
    # Sem "ports": o Prometheus não tem autenticação e a 9090 é de outros
    # projetos. Só a rede interna da pilha o alcança (o Grafana lê
    # prometheus:9090). Para consultar: "Consultar o Prometheus" no README.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      blackbox:
        condition: service_healthy
    # Logs com rotação: sem isto o disco do PC enche aos poucos.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    restart: unless-stopped
    # 64m: ~12-24 MiB medido (até 37%).
    mem_limit: 64m
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    # Sem "ports": só o Prometheus (mesma rede da pilha) fala com o blackbox.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9115/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Túnel SSH (autossh) até o loopback da VPS: encaminha 127.0.0.1:8082
  # (Traefik), 127.0.0.1:9100 (node exporter) e 127.0.0.1:3100 (Loki) da VPS
  # para tunel:8082, tunel:9100 e tunel:3100 nesta rede interna. Reconecta
  # sozinho (keepalive + autossh + restart). Detalhes em tunel/iniciar.sh.
  # Nem o Prometheus nem o Grafana dependem dele de propósito: com o túnel (ou o
  # Loki) fora, a pilha continua testando os sites, os jobs traefik/node
  # aparecem "down" e só a fonte de dados Loki falha.
  tunel:
    build: ./tunel
    restart: unless-stopped
    # 32m: ~3 MiB medido (autossh + nc); sobra muito.
    mem_limit: 32m
    environment:
      # Do .env. Vazio = o container sai com erro explicando o que falta.
      TUNEL_HOST: ${TUNEL_HOST:-}
      TUNEL_USUARIO: ${TUNEL_USUARIO:-metricas}
      TUNEL_PORTA_SSH: ${TUNEL_PORTA_SSH:-22}
    volumes:
      # chaves/id_tunel e chaves/known_hosts: fora do git (.gitignore), só leitura.
      - ./chaves:/chaves:ro
    # Sem "ports": as portas encaminhadas só existem na rede interna da pilha.
    # Nada ocupa 8080/8082 do PC, então o túnel manual do painel
    # (ssh -L 8080 -L 8082) funciona ao mesmo tempo.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Os três encaminhamentos estão ouvindo (o ssh só os abre conectado).
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8082 && nc -z 127.0.0.1 9100 && nc -z 127.0.0.1 3100"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Grafana: abre já com as fontes de dados (Prometheus e Loki) e os painéis
  # Traefik, Host (Node Exporter Full), Sites e Logs, tudo provisionado por
  # arquivo (grafana/). Recriar do zero não exige clique.
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    # 1g (subiu dos 512m do ponto de partida): a pilha real chegou a ~763 MiB,
    # que em 512m seria OOM e, mesmo em 768m, passaria de 70%. Recém-subido o
    # Grafana enxuto usa ~260 MiB; 1g mantém o uso real de hoje em ~75% e o
    # enxuto bem abaixo dos 70%. Medir de novo (docker stats) depois de dias
    # no ar com as chaves de leveza e baixar o teto se o uso estável permitir.
    mem_limit: 1g
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Obrigatória no .env: sem ela o compose nem sobe (nada de admin/admin).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA_ADMIN:?defina GRAFANA_SENHA_ADMIN no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Mais leve (Grafana local, um usuário): nada de baixar plugins,
      # checar atualização deles, buscar notícias ou publicar snapshots fora.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # Alertas no Telegram: o Grafana troca $TELEGRAM_* nos
      # arquivos de grafana/provisioning/alerting/. Token e chat ID só no .env.
      # Os limites ficam em regras.yml (o Grafana não troca env nas regras).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?defina TELEGRAM_BOT_TOKEN no .env (veja "Alertas no Telegram" no README)}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?defina TELEGRAM_CHAT_ID no .env (veja "Alertas no Telegram" no README)}
    volumes:
      - grafana-dados:/var/lib/grafana
      # Provisionamento: datasources/, dashboards/ (provedor) e alerting/
      # (contact point, política e regras de alerta).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # JSONs dos painéis, versionados no repositório.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Só no loopback do PC; acesso de fora, só por túnel SSH/VPN. 23000 e não
      # 3000: a pilha fica de pé o tempo todo e a 3000 é de outros projetos.
      - "127.0.0.1:${PORTA_GRAFANA:-23000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # Dados do Prometheus. Sobrevivem a "docker compose down" (NÃO use
  # "down -v" fora do smoke test: apaga o histórico).
  prometheus-dados:
  # Dados do Grafana (usuários, preferências). Painéis e fonte de dados vêm
  # dos arquivos, então perder o volume não perde configuração.
  grafana-dados:
