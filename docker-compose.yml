# Pilha de monitoramento da VPS, rodando no PC (não na VPS).
#
# Uso:
#   cp .env.example .env     # preencha TUNEL_HOST (veja "Túnel até a VPS")
#   docker compose up -d --build
#   docker compose ps
#
# Versões FIXAS (nada de latest): cada imagem aparece uma única vez, aqui
# (a do túnel, no tunel/Dockerfile).
# Veja "Fixar e atualizar as versões" no README antes de trocar uma tag.
#
# Verificação rápida sem subir nada: docker compose config -q
name: homelab-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retenção por tempo: 90 dias de histórico.
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Monta a PASTA (não o arquivo): o Prometheus relê os alvos sozinho
      # quando algo muda, sem reiniciar. Adicionar site = editar sites.yml.
      - ./prometheus/alvos:/etc/prometheus/alvos:ro
      - prometheus-dados:/prometheus
    ports:
      # Só no loopback do PC: o Prometheus não tem autenticação.
      - "127.0.0.1:${PORTA_PROMETHEUS:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      blackbox:
        condition: service_healthy
    # Logs com rotação: sem isto o disco do PC enche aos poucos.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    # Sem "ports": só o Prometheus (mesma rede da pilha) fala com o blackbox.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9115/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Túnel SSH (autossh) até o loopback da VPS: encaminha 127.0.0.1:8082
  # (Traefik) e 127.0.0.1:9100 (node exporter) da VPS para tunel:8082 e
  # tunel:9100 nesta rede interna. Reconecta sozinho (keepalive + autossh +
  # restart). Detalhes em tunel/iniciar.sh.
  # O Prometheus NÃO depende dele de propósito: com o túnel fora, a pilha
  # continua testando os sites e o job traefik/node aparece "down".
  tunel:
    build: ./tunel
    restart: unless-stopped
    environment:
      # Do .env. Vazio = o container sai com erro explicando o que falta.
      TUNEL_HOST: ${TUNEL_HOST:-}
      TUNEL_USUARIO: ${TUNEL_USUARIO:-metricas}
      TUNEL_PORTA_SSH: ${TUNEL_PORTA_SSH:-22}
    volumes:
      # chaves/id_tunel e chaves/known_hosts: fora do git (.gitignore), só leitura.
      - ./chaves:/chaves:ro
    # Sem "ports": as portas encaminhadas só existem na rede interna da pilha.
    # Nada ocupa 8080/8082 do PC, então o túnel manual do painel
    # (ssh -L 8080 -L 8082) funciona ao mesmo tempo.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Os dois encaminhamentos estão ouvindo (o ssh só os abre conectado).
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8082 && nc -z 127.0.0.1 9100"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Grafana: abre já com a fonte de dados Prometheus e os painéis Traefik,
  # Host (Node Exporter Full) e Sites, tudo provisionado por arquivo
  # (grafana/). Recriar do zero não exige clique.
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Obrigatória no .env: sem ela o compose nem sobe (nada de admin/admin).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA_ADMIN:?defina GRAFANA_SENHA_ADMIN no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Alertas no Telegram: o Grafana troca $TELEGRAM_* nos
      # arquivos de grafana/provisioning/alerting/. Token e chat ID só no .env.
      # Os limites ficam em regras.yml (o Grafana não troca env nas regras).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?defina TELEGRAM_BOT_TOKEN no .env (veja "Alertas no Telegram" no README)}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?defina TELEGRAM_CHAT_ID no .env (veja "Alertas no Telegram" no README)}
    volumes:
      - grafana-dados:/var/lib/grafana
      # Provisionamento: datasources/, dashboards/ (provedor) e alerting/
      # (contact point, política e regras de alerta).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # JSONs dos painéis, versionados no repositório.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Só no loopback do PC; acesso de fora, só por túnel SSH/VPN.
      - "127.0.0.1:${PORTA_GRAFANA:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # Dados do Prometheus. Sobrevivem a "docker compose down" (NÃO use
  # "down -v" fora do smoke test: apaga o histórico).
  prometheus-dados:
  # Dados do Grafana (usuários, preferências). Painéis e fonte de dados vêm
  # dos arquivos, então perder o volume não perde configuração.
  grafana-dados:
