# Monthly update of the PC stack's Docker images.
# Opens at most one PR per ecosystem, only with versions published at least
# 14 days ago (cooldown). Nothing is applied on its own: there is no auto-merge,
# the PR is reviewed and approved by hand (see "Pinning and updating versions"
# in the README).
# The tags in testes/smoke.env are not read by Dependabot (separate ticket).
version: 2
updates:
  # Prometheus, blackbox and Grafana (docker-compose.yml in the root).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      imagens-compose:
        patterns: ["*"]
  # Tunnel Alpine (tunel/Dockerfile).
  - package-ecosystem: docker
    directory: /tunel
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      imagens-dockerfile:
        patterns: ["*"]
