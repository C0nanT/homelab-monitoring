# Dashboard provider: loads the JSON files from grafana/dashboards/ (mounted at
# /var/lib/grafana/dashboards). Changed a JSON? Grafana rereads within 30s.
apiVersion: 1
providers:
  - name: padrao
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
