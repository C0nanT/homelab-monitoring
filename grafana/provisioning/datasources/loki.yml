# Provisioned data source: the VPS's Loki, reached through the SSH tunnel
# (tunel:3100 -> VPS 127.0.0.1:3100). The uid is fixed on purpose: the Logs
# dashboard references it. Prometheus remains the default source
# (prometheus.yml). With the tunnel or Loki down, only this source fails (red
# "Test"); the rest of Grafana and Prometheus do not depend on it.
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://tunel:3100
    isDefault: false
    editable: false
    jsonData:
      # Line cap per query in Explore and in dashboards.
      maxLines: 1000
