# Alert rules (Grafana, no Alertmanager). Data comes from Prometheus.
#
# THRESHOLDS: all of them are here, in the "limites" block just below; it is
# the ONLY place to adjust them. The wait times (for:) live on each rule:
# site/job 5m, 5xx 10m, cron stopped 5m; deploy failed does not wait (0s).
# After changing, restart Grafana: docker compose restart grafana
#
# Why they are not in .env: Grafana 13.2.3 does NOT substitute environment
# variables inside rules (only in the contact point). Tested: "$VARIABLE"
# reaches the query literally, and in the "threshold" node it becomes text and
# the rule errors (cannot unmarshal string into float64). So the numbers are
# YAML anchors (&name / *name), valid only inside this file, and Grafana
# ignores the "limites" block.
#
# Each rule generates one alert PER series (per certificate, site, service...),
# and the message (summary) says which one and the current value. No data
# (NoData) = OK: a stopped collection has its own rule ("VPS collection
# stopped").
apiVersion: 1

limites:
  cert_dias: &limite_cert_dias 20      # certificate with fewer than N days left
  5xx_pct: &limite_5xx_pct 5           # 5xx rate above N % ...
  5xx_trafego_min: &limite_5xx_trafego_min 0.05   # ... only with more than N req/s (10 min)
  disco_pct: &limite_disco_pct 85      # VPS disk / above N %
  deploy_parado_min: &limite_deploy_parado_min 30   # deploy cron not run for more than N min

groups:
  - orgId: 1
    name: certificados
    folder: Alertas
    interval: 1m
    rules:
      - uid: cert-traefik
        title: Certificate expiring (Traefik)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: 'Certificate for {{ $labels.cn }} expires in {{ printf "%.1f" $values.B.Value }} days'
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                (traefik_tls_certs_not_after - time()) / 86400
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: lt, params: [*limite_cert_dias]}}]
      - uid: cert-site
        title: Certificate expiring (site)
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: 'Certificate of site {{ $labels.instance }} (seen from outside) expires in {{ printf "%.1f" $values.B.Value }} days'
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              # "> 0" filters the raw timestamp (drops a possible 0 from a
              # probe with no certificate), not the days: an already expired
              # certificate (negative days) keeps alerting. With TLS
              # verification on, blackbox (v0.29) does not even emit this
              # series when the certificate is invalid, expired or the site
              # does not respond: those cases fall under "Site down".
              expr: >-
                ((probe_ssl_earliest_cert_expiry{job="sites"} > 0) - time()) / 86400
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: lt, params: [*limite_cert_dias]}}]
  - orgId: 1
    name: sites
    folder: Alertas
    interval: 1m
    rules:
      - uid: site-fora
        title: Site down
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: 'Site {{ $labels.instance }} has been down for more than 5 minutes (probe_success = {{ printf "%.0f" $values.B.Value }})'
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                probe_success{job="sites"}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: lt, params: [1]}}]
  - orgId: 1
    name: traefik
    folder: Alertas
    interval: 1m
    rules:
      - uid: taxa-5xx
        title: High 5xx rate
        # Fires if (5xx / total) > threshold AND traffic > minimum: a service
        # with almost no traffic (1 error in 4 requests) does not alert.
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: 'Service {{ $labels.service }} has {{ printf "%.1f" $values.B.Value }}% 5xx responses over the last 10 minutes ({{ printf "%.2f" $values.D.Value }} req/s)'
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                100 * sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[10m]))
                / sum by (service) (rate(traefik_service_requests_total[10m]))
          - refId: T
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: T
              instant: true
              expr: sum by (service) (rate(traefik_service_requests_total[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: D
            datasourceUid: __expr__
            model:
              refId: D
              type: reduce
              expression: T
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [*limite_5xx_pct]}}]
          - refId: F
            datasourceUid: __expr__
            model:
              refId: F
              type: threshold
              expression: D
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [*limite_5xx_trafego_min]}}]
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: $E && $F
              datasource: {type: __expr__, uid: __expr__}
  - orgId: 1
    name: vps
    folder: Alertas
    interval: 1m
    rules:
      - uid: disco-cheio
        title: VPS disk full
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: 'VPS disk / ({{ $labels.instance }}) at {{ printf "%.1f" $values.B.Value }}%'
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                100 * (1 - node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"}
                  / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!~"tmpfs|overlay"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [*limite_disco_pct]}}]
      - uid: coleta-parada
        title: VPS collection stopped
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: 'Job {{ $labels.job }} ({{ $labels.instance }}) has not responded for more than 5 minutes: tunnel or exporter is down'
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                up{job=~"traefik|node"}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: lt, params: [1]}}]
  - orgId: 1
    name: deploy
    folder: Alertas
    interval: 1m
    rules:
      - uid: deploy-falhou
        title: Deploy failed (VPS)
        # deploy_falhou{app} comes from the VPS cron (node exporter textfile
        # collector): 1 = that site's pull or up failed in the last run.
        # No wait: alerts on the first failure. Resolves when the next run
        # succeeds (back to 0). The "> 0" (node C) is not an adjustable
        # threshold: deploy_falhou is boolean (0/1), so it stays out of "limites".
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: 'Deploy of site {{ $labels.app }} failed in the VPS cron last run (see the "Deploy (cron)" row of the Logs dashboard)'
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                deploy_falhou{job="node"}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [0]}}]
      - uid: cron-deploy-parado
        title: Deploy cron stopped
        # Minutes since the last run. If the series vanishes (absent), the
        # second part of the query returns 99999 and the alert fires all the
        # same. The 5m wait absorbs boot of the homelab: the tunnel to the VPS
        # is not up yet, the series is absent and 99999 would fire a false
        # alarm. With the whole VPS collection stopped, this one and "VPS
        # collection stopped" may fire together (accepted): this one only
        # looks at the age of the last data point.
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: 'VPS deploy cron has not run beyond the deploy_parado_min limit (last run {{ printf "%.0f" $values.B.Value }} min ago; 99999 = the series vanished)'
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                (time() - max(deploy_rodada_timestamp_seconds{job="node"})) / 60
                or absent(deploy_rodada_timestamp_seconds{job="node"}) * 99999
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: {type: __expr__, uid: __expr__}
              conditions: [{evaluator: {type: gt, params: [*limite_deploy_parado_min]}}]
      - uid: ghcr-token-vence
        title: GHCR token expiring (VPS)
        # ghcr_token_expira_timestamp_seconds comes from the VPS cron: it asks
        # GitHub, every run, when the token of `docker login ghcr.io` expires.
        # A renewed token = new date on the next run, so nothing fires. Without
        # the series (token with no expiry) = NoData = OK.
        # Fires only on the whole days left in node C (30, 20, 10, 7, 5, 3, 2,
        # 1, 0), each day for 24h. The "dias" label makes each day a new
        # instance, so 3 -> 2 -> 1 -> 0 send one message each; the "aviso"
        # label routes it to the policy without the "resolved" message (see
        # contato.yml). Already expired: the "Deploy failed" alert covers it.
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          aviso: dias
          dias: '{{ printf "%.0f" .Values.B.Value }}'
        annotations:
          summary: 'The GHCR token of the VPS (docker login ghcr.io) expires in {{ printf "%.0f" $values.B.Value }} days: create a new one with read:packages and run docker login ghcr.io on the VPS'
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                floor((max(ghcr_token_expira_timestamp_seconds{job="node"}) - time()) / 86400)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: >-
                $B == 30 || $B == 20 || $B == 10 || $B == 7 || $B == 5 || ($B >= 0 && $B <= 3)
              datasource: {type: __expr__, uid: __expr__}
