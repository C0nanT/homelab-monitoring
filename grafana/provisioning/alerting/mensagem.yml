# Telegram message text (used by the contact point in contato.yml).
# One message per alert group; each alert becomes a block:
#
#   🔴 CRITICAL · Site down
#   Site https://conantorres.dev has been down for more than 5 minutes (...)
#   🕐 since Oct 27 14:32
#
# No "$" in here: Grafana substitutes $VARIABLE in provisioning files. That is
# why it uses .Labels/.Annotations instead of $labels.
# Telegram HTML format (parse_mode in contato.yml). Times are Brasília time.
apiVersion: 1

templates:
  - orgId: 1
    name: telegram
    template: |
      {{ define "telegram.hora" }}{{ . | tz "America/Sao_Paulo" | date "Jan 02 15:04" }}{{ end }}

      {{ define "telegram.alerta" -}}
      {{ if eq .Status "resolved" }}✅ <b>RESOLVED</b>
      {{- else if eq .Labels.severity "critical" }}🔴 <b>CRITICAL</b>
      {{- else if eq .Labels.severity "warning" }}🟠 <b>WARNING</b>
      {{- else }}🔵 <b>NOTICE</b>{{ end }} · <b>{{ .Labels.alertname }}</b>
      {{ .Annotations.summary }}
      {{ if eq .Status "resolved" -}}
      🕐 {{ template "telegram.hora" .StartsAt }} → {{ template "telegram.hora" .EndsAt }}
      {{- else -}}
      🕐 since {{ template "telegram.hora" .StartsAt }}
      {{- end }}
      {{- end }}

      {{ define "telegram.mensagem" -}}
      {{ range .Alerts }}{{ template "telegram.alerta" . }}

      {{ end -}}
      {{- end }}
